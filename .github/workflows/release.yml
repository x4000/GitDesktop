name: Release

# Fork-owned. Replaces upstream's draft-release.yml / release-pr.yml, which
# published to central.github.com.
#
# Trigger: pushing a semver tag. The tag MUST be plain semver ('3.6.4' or
# 'v3.6.4') -- update.electronjs.org runs semver.valid() on the tag name and
# ignores anything else, so upstream's 'release-3.6.4' convention would produce
# a release the update feed never sees.
#
# The published GitHub Release must not be a draft or a prerelease, for the
# same reason.
#
# macOS: we do not sign or notarize. Squirrel.Mac refuses to apply an update to
# an unsigned app, so publishing a macOS zip to the release would put Mac
# clients in a loop -- the feed offers an update, the app downloads it, and the
# install silently fails on restart. Instead macOS is built (to catch build
# breakage, and to produce a downloadable artifact for manual installs) but its
# zip is NOT attached to the release, so the feed has nothing to offer and Mac
# clients cleanly see "no update available".
#
# To enable macOS updates later: add the APPLE_* secrets, restore them to the
# build step below, and set PUBLISH_MACOS to 'true'.

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+'
  # Manual runs build and upload artifacts but never publish a release --
  # GITHUB_REF_NAME is a branch name outside a tag push, and publishing under
  # that name would create a release the update feed cannot parse.
  workflow_dispatch:

env:
  NODE_VERSION: 24.15.0
  # Flip to 'true' once macOS builds are signed and notarized.
  PUBLISH_MACOS: 'false'

jobs:
  build:
    name: ${{ matrix.friendlyName }} ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        # Windows only. macOS is not published (see PUBLISH_MACOS above and the
        # header comment), so building it produced artifacts we then threw
        # away -- and it did so on macos-14-xlarge, a *larger* runner, which is
        # billed even for public repositories. The first release failed there
        # on billing before Windows had started.
        #
        # To restore macOS once it is signed: add a `macos-14` entry (standard,
        # free for public repos, arm64) and set PUBLISH_MACOS to 'true'. Note
        # that macos-14 is Apple Silicon, so an x64 build needs macos-13 or
        # cross-compilation via npm_config_arch.
        os: [windows-2022]
        # x64 only: that is what we serve. Windows on arm64 runs x64 builds
        # under emulation, so an arm64 build is an optimisation, not a
        # requirement. Add 'arm64' back here when it is worth the build time --
        # the asset naming and RELEASES merge already handle both.
        arch: [x64]
        include:
          - os: windows-2022
            friendlyName: Windows
    timeout-minutes: 60
    env:
      RELEASE_CHANNEL: production
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: ./.github/actions/setup-ci-environment
        with:
          node-version: ${{ env.NODE_VERSION }}
          arch: ${{ matrix.arch }}

      - name: Verify tag matches app/package.json version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "push" ]; then
            echo "Not a tag build; skipping version check."
            exit 0
          fi
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./app/package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::Tag '$tag' does not match app/package.json version '$pkg'."
            echo "The update feed keys off the tag, and the app compares against"
            echo "its baked-in version. A mismatch means clients either never see"
            echo "the update or re-download it forever."
            exit 1
          fi

      - name: Build production app
        run: yarn build:prod
        env:
          # Device flow only needs the client id -- there is deliberately no
          # DESKTOP_OAUTH_CLIENT_SECRET here.
          DESKTOP_OAUTH_CLIENT_ID: ${{ secrets.DESKTOP_OAUTH_CLIENT_ID }}
          # No APPLE_* secrets: macOS builds are unsigned and unnotarized. See
          # the header comment. getNotarizationOptions() in script/build.ts
          # returns undefined when they are absent, so the build still succeeds.
          npm_config_arch: ${{ matrix.arch }}
          TARGET_ARCH: ${{ matrix.arch }}

      - name: Package production app
        run: yarn package
        env:
          npm_config_arch: ${{ matrix.arch }}

      # Windows produces a RELEASES file per architecture, but a GitHub Release
      # can only hold one asset named 'RELEASES' and update.electronjs.org
      # always fetches exactly that name. We stage each arch's copy under a
      # distinct name and merge them in the release job.
      - name: Stage Windows RELEASES
        if: runner.os == 'Windows'
        shell: bash
        run: mv dist/RELEASES "dist/RELEASES-${{ matrix.arch }}"

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.friendlyName }}-${{ matrix.arch }}
          path: |
            dist/GitDesktop-darwin-${{ matrix.arch }}.zip
            dist/GitDesktop-*-win32-${{ matrix.arch }}-*.nupkg
            dist/GitDesktopSetup-win32-${{ matrix.arch }}.exe
            dist/RELEASES-${{ matrix.arch }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: artifacts
          merge-multiple: true

      - name: Merge per-arch RELEASES files
        shell: bash
        working-directory: artifacts
        run: |
          set -euo pipefail
          # Squirrel's RELEASES format is one entry per line:
          #   <SHA1> <nupkg filename> <size>
          # Because script/package.ts rewrote each entry to use the
          # arch-qualified .nupkg name, the two files can simply be
          # concatenated. update.electronjs.org reads this single file and
          # substitutes the .nupkg matching the requested architecture.
          : > RELEASES
          for f in RELEASES-x64 RELEASES-arm64; do
            if [ -f "$f" ]; then
              cat "$f" >> RELEASES
              rm "$f"
            fi
          done
          if [ ! -s RELEASES ]; then
            echo "::error::Merged RELEASES file is empty."
            exit 1
          fi
          echo "Merged RELEASES:"
          cat RELEASES

      # Unsigned macOS builds cannot be updated by Squirrel.Mac. Withholding
      # the zip from the release means the feed reports "no update" to Mac
      # clients instead of handing them one that fails to install. The build
      # artifact is still downloadable from the workflow run for manual
      # installs. See the header comment.
      - name: Withhold unsigned macOS assets
        if: env.PUBLISH_MACOS != 'true'
        shell: bash
        working-directory: artifacts
        run: |
          set -euo pipefail
          rm -fv GitDesktop-darwin-*.zip
          echo "macOS assets withheld (PUBLISH_MACOS=${PUBLISH_MACOS})."

      - name: Verify asset names match the update feed matcher
        shell: bash
        working-directory: artifacts
        run: |
          set -euo pipefail
          fail=0
          check() {
            if ! ls $1 >/dev/null 2>&1; then
              echo "::error::Missing expected asset matching '$1'"
              fail=1
            fi
          }
          # win32: /.*-win32-(ia32|x64|arm64).*/
          check 'GitDesktopSetup-win32-x64.exe'
          check '*-win32-x64-full.nupkg'
          check 'RELEASES'
          if [ "${PUBLISH_MACOS}" = "true" ]; then
            # darwin: /.*-(mac|darwin|osx).*\.zip$/, arm64 keyed on '-arm64'
            check 'GitDesktop-darwin-x64.zip'
            check 'GitDesktop-darwin-arm64.zip'
          fi
          exit $fail

      # Uses the built-in gh CLI rather than a third-party release action --
      # one less external dependency in the publishing path.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          # Neither --draft nor --prerelease: update.electronjs.org skips both
          # kinds of release entirely, so either flag ships an update nobody
          # receives.
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            artifacts/*
