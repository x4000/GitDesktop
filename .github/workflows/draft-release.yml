# Disabled in this fork.
#
# Upstream's release drafter drives the production/beta/test channel split via
# script/draft-release/, which we removed. This fork ships a single channel
# because update.electronjs.org skips draft and prerelease GitHub Releases.
#
# Our release flow is: bump app/package.json, tag with plain semver
# ('3.6.4', not 'release-3.6.4'), and let .github/workflows/release.yml build
# and publish.
#
# The file is kept as a stub rather than deleted so that .gitattributes can
# mark it `merge=ours`. A deleted file produces a modify/delete conflict every
# time upstream touches it; a stub with `merge=ours` produces none.
#
# Do not add jobs here. See docs/fork/MERGING.md.
name: 'Draft Release (disabled)'

on:
  workflow_dispatch:

jobs:
  noop:
    name: Disabled in fork
    runs-on: ubuntu-latest
    steps:
      - run: echo "Disabled in this fork. See .github/workflows/release.yml."
